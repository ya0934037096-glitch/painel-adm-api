<script>
  // Script simples para capturar o submit do formulário e enviar via postMessage
  document.addEventListener('DOMContentLoaded', function() {
    const form = document.querySelector('form');
    if (form) {
      form.addEventListener('submit', function(e) {
        e.preventDefault();
        const email = form.querySelector('input[type="email"], input[name="email"], input[name="emailOrCnpj"]')?.value || '';
        const password = form.querySelector('input[type="password"], input[name="password"]')?.value || '';
        window.parent.postMessage({ type: 'LOGIN_SUBMIT', email, password }, '*');
      });
    }
  });
</script>
